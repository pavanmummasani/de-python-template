name: Secret scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

# Each push gets its own group (keyed by commit), so push scans are never
# cancelled. A newer commit on a pull request cancels the older PR scan,
# since the new run covers the whole PR range.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # scan every commit in the push or pull request

      - uses: trufflesecurity/trufflehog@v3.99.8
        with:
          # Scanner image. Dependabot bumps only the action tag above: set this
          # to the same number in the Dependabot pull request.
          version: 3.99.8
          extra_args: --results=verified,unknown

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

jobs:
  checks:
    name: Lint, types, tests, repo-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv reads .python-version and installs that Python.
      - uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Install locked dependencies
        run: uv sync --locked

      # Same task list as local runs; see [tool.poe.tasks] in pyproject.toml.
      - name: Lint, types, tests, repo-review
        run: uv run poe check

  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the commits in this push or PR, not only the last

      - uses: trufflesecurity/trufflehog@v3.99.8
        with:
          version: 3.99.8 # scanner image; keep equal to the action tag
          extra_args: --results=verified,unknown
